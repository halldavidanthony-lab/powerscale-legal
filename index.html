<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Legal — PowerScale</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.7;
      color: #1a1a2e;
      background: #f8f8fc;
      padding: 0 16px;
    }
    .page { max-width: 720px; margin: 0 auto; padding: 80px 0; }
    .brand { font-size: 13px; font-weight: 700; letter-spacing: 0.12em; color: #6c47ff; text-transform: uppercase; margin-bottom: 8px; }
    h1 { font-size: 2rem; font-weight: 900; margin-bottom: 32px; }
    .links { display: flex; flex-direction: column; gap: 12px; }
    .link-card {
      display: block;
      background: #fff;
      border: 1px solid #e0e0f0;
      border-radius: 10px;
      padding: 20px 24px;
      text-decoration: none;
      color: #1a1a2e;
      font-weight: 700;
      font-size: 1.05rem;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .link-card:hover { border-color: #6c47ff; box-shadow: 0 0 0 3px #ede9ff; }
    .link-card span { display: block; font-size: 14px; font-weight: 400; color: #666; margin-top: 3px; }
  </style>
</head>
<body>
  <div class="page">
    <div class="brand">PowerScale</div>
    <h1>Legal</h1>
    <div class="links">
      <a class="link-card" href="/privacy">
        Privacy Policy
        <span>How we collect, use, and protect your data — including HealthKit and fitness data.</span>
      </a>
      <a class="link-card" href="/terms">
        Terms of Service
        <span>Rules of use, subscription terms, health disclaimer, and your rights.</span>
      </a>
    </div>
  </div>
</body>
</html>
